# Legacy Aesthetic — QA/staging static server.
# Serves the Astro `dist/` (mounted at /usr/share/nginx/html) with clean URLs.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- QA ONLY: keep this staging copy out of search engines ---
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Override robots.txt to disallow everything (the prod one allows crawling).
    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/xml+rss;

    # Fingerprinted assets — cache hard (re-add the header; nginx drops inherited
    # add_header when a location defines its own).
    location /_astro/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Clean directory-style URLs (Astro build.format: 'directory').
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Custom 404 page from the build.
    error_page 404 /404.html;
}
