# Legacy Aesthetic — QA stack: nginx (static) + Cloudflare Tunnel.
# Run from this folder:  docker compose up -d
services:
  web:
    image: nginx:1.27-alpine
    container_name: legacy-qa-web
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Optional: lets you test on the LAN at http://<lxc-ip>:8080 before/without
      # the tunnel. Remove this block if you only want access via Cloudflare.
      - "8080:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: legacy-qa-tunnel
    restart: unless-stopped
    # Token is passed on the command line (the reliable form). It's read from the
    # .env file in this folder; compose fails fast with a clear message if unset.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env — copy .env.example to .env and paste your Cloudflare tunnel token}
    depends_on:
      - web
