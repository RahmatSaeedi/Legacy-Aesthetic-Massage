# Legacy Aesthetic — QA stack: nginx (static) + Cloudflare Tunnel.
# Run from this folder:  docker compose up -d
services:
  web:
    image: nginx:1.27-alpine
    container_name: legacy-qa-web
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Optional: lets you test on the LAN at http://<lxc-ip>:8080 before/without
      # the tunnel. Remove this block if you only want access via Cloudflare.
      - "8080:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: legacy-qa-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Provided via the .env file in this folder.
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
